<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ECCN Classifier — Rule-Based</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#08070e;--surface:rgba(255,255,255,0.028);--surface2:rgba(255,255,255,0.05);
  --border:rgba(140,120,200,0.1);--border2:rgba(140,120,200,0.2);
  --accent:#8b5cf6;--accent2:#a78bfa;--accent3:#c4b5fd;
  --gold:#f59e0b;--gold2:#fbbf24;--gold3:#fde68a;
  --red:#ef4444;--green:#4ade80;--green2:#86efac;
  --text:#ddd6fe;--text2:#a8a0c8;--text3:#6b6490;
  --mono:'JetBrains Mono',monospace;
  --sans:'DM Sans','Noto Sans KR',sans-serif;
}
body{min-height:100vh;background:var(--bg);font-family:var(--sans);color:var(--text);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,92,246,0.08),transparent 70%);pointer-events:none;z-index:0;}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 24px rgba(139,92,246,0.2)}50%{box-shadow:0 0 48px rgba(139,92,246,0.4)}}

.container{max-width:820px;margin:0 auto;padding:28px 18px;position:relative;z-index:1;}
.header{text-align:center;margin-bottom:36px;animation:fadeUp .6s ease-out;}
.header-badge{display:inline-flex;align-items:center;gap:10px;padding:10px 24px;border-radius:44px;background:linear-gradient(135deg,rgba(139,92,246,0.12),rgba(99,102,241,0.08));border:1px solid rgba(139,92,246,0.2);margin-bottom:8px;}
.header-title{font-size:22px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent3),var(--accent),#6d28d9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-sub{color:var(--text3);font-size:12px;line-height:1.5;}

.steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px;flex-wrap:wrap;}
.step-item{display:flex;align-items:center;}
.step-node{display:flex;flex-direction:column;align-items:center;min-width:60px;}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all .35s;border:2px solid transparent;}
.step-circle.done{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.step-circle.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border-color:var(--gold2);box-shadow:0 0 14px rgba(245,158,11,.35);}
.step-circle.pending{background:rgba(255,255,255,.04);color:var(--text3);}
.step-label{font-size:10px;margin-top:4px;white-space:nowrap;}
.step-label.done,.step-label.active{color:var(--text);}
.step-label.pending{color:var(--text3);}
.step-line{width:30px;height:2px;margin:0 2px;margin-bottom:18px;border-radius:1px;}
.step-line.done{background:var(--accent);}
.step-line.pending{background:rgba(255,255,255,.06);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:18px;animation:fadeUp .4s ease-out;}
.card-title{font-size:15px;font-weight:600;color:var(--accent3);margin-bottom:16px;display:flex;align-items:center;gap:8px;}

.field{margin-bottom:14px;}
.field-label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.field-label .req{color:var(--red);margin-left:2px;}
input.inp,select.inp{
  width:100%;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:var(--sans);
}
input.inp:focus{border-color:var(--accent);}
input.inp::placeholder{color:var(--text3);}

.btn{padding:10px 22px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px;transition:all .2s;font-family:var(--sans);border:none;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:linear-gradient(135deg,var(--accent),#6d28d9);color:#fff;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(139,92,246,.35);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--accent3);border:1px solid var(--border);}
.btn-ghost:hover{background:rgba(255,255,255,.07);border-color:var(--border2);}
.btn-row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

.cand{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;background:rgba(255,255,255,.015);border-radius:10px;border:1px solid rgba(255,255,255,.04);margin-bottom:6px;transition:background .2s;}
.cand:hover{background:rgba(255,255,255,.035);}
.cand-eccn{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--accent2);min-width:80px;flex-shrink:0;}
.cand-body{flex:1;min-width:0;}
.cand-title{font-size:13px;font-weight:500;margin-bottom:2px;}
.cand-reason{font-size:11px;color:var(--text3);}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.badge-high{background:rgba(239,68,68,.12);color:#fca5a5;}
.badge-medium{background:rgba(251,191,36,.12);color:#fde68a;}
.badge-low{background:rgba(74,222,128,.12);color:#86efac;}

.param-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.015);border-radius:8px;margin-bottom:6px;flex-wrap:wrap;}
.param-info{flex:1 1 180px;min-width:140px;}
.param-name{font-size:12px;font-weight:500;}
.param-thresh{font-size:10px;color:var(--text3);}
.param-input{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.param-unit{font-size:11px;color:var(--text3);min-width:50px;}
.param-status{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:600;}
.param-pass{background:rgba(74,222,128,.1);color:var(--green);}
.param-fail{background:rgba(239,68,68,.1);color:#fca5a5;}
.param-na{background:rgba(255,255,255,.05);color:var(--text3);}

.result-card{background:linear-gradient(135deg,rgba(139,92,246,.06),rgba(99,102,241,.04));border:1px solid rgba(139,92,246,.2);border-radius:16px;padding:28px;margin-bottom:18px;animation:glow 4s ease-in-out infinite;}
.result-eccn{font-size:40px;font-weight:800;font-family:var(--mono);letter-spacing:1px;background:linear-gradient(135deg,var(--gold),var(--gold2),#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;}
.result-section{padding:12px 14px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:10px;}
.result-section-title{font-size:12px;font-weight:600;color:var(--accent3);margin-bottom:4px;}
.result-section-text{font-size:13px;color:#bbb;line-height:1.65;}

.eccn-group{margin-bottom:14px;}
.eccn-group-header{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.eccn-tag{font-family:var(--mono);background:rgba(245,158,11,.1);padding:2px 8px;border-radius:4px;font-size:12px;}

.case-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
.case-table th{padding:6px 10px;text-align:left;color:var(--accent3);font-weight:600;font-size:11px;border-bottom:1px solid var(--border);}
.case-table td{padding:5px 10px;border-bottom:1px solid rgba(255,255,255,.03);}
.case-eccn{background:rgba(139,92,246,.2);padding:2px 8px;border-radius:4px;color:var(--accent3);font-family:var(--mono);font-size:11px;}

.footer{text-align:center;margin-top:40px;padding:18px 0;border-top:1px solid rgba(255,255,255,.04);font-size:10px;color:var(--text3);line-height:1.6;}

@media(max-width:600px){
  .container{padding:16px 12px;}
  .cand{flex-wrap:wrap;}.cand-eccn{min-width:auto;}
  .param-row{flex-direction:column;align-items:flex-start;}
  .param-input{width:100%;}.param-input input{flex:1;}
}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════
// ECCN DATABASE + DECISION TREE ENGINE
// ═══════════════════════════════════════════════════════════

const ECCN_DB = {
  "3A090": {
    title: "Advanced computing ICs (high-end AI/HPC)",
    category: "3", keywords: ["gpu","ai accelerator","ai chip","tpu","npu","machine learning","deep learning","neural","datacenter gpu","hpc gpu","training chip","inference chip","가속기","인공지능칩","ai 칩"],
    params: [

      { name: "Performance Density (PD)", key: "pd", unit: "TOPS/mm²", threshold: 5.92, op: ">", desc: "TPP ÷ 총 다이 면적" }

  },
  "4A090": {
    title: "3A090 IC를 포함하는 컴퓨터 시스템",

    params: [
      { name: "Contains 3A090 IC", key: "has_3a090", unit: "1=yes/0=no", threshold: 1, op: "=", desc: "3A090 분류 IC 탑재 여부" },

      { name: "Gate count (FPGA/PLD)", key: "gate_count", unit: "gates", threshold: 700000, op: ">", desc: "사용자 프로그래머블 게이트 수" },

  "3A002": {
    title: "전자 측정/검사 장비",
    category: "3", keywords: ["oscilloscope","spectrum analyzer","signal analyzer","network analyzer","test equipment","측정기","오실로스코프","분석기","logic analyzer","계측기"],
    params: [
      { name: "Bandwidth", key: "bandwidth_ghz", unit: "GHz", threshold: 4, op: ">", desc: "실시간 대역폭" },

    restrictions: "NS/AT 통제. D:1 국가 라이선스 필요.",
  },
  "3A991": {

    params: [
      { name: "Gate count", key: "gate_count", unit: "gates", threshold: 700000, op: "<=", desc: "3A001 기준 미달" }

  },
  "4A994": {

    params: [

    params: [
      { name: "Symmetric key length", key: "key_sym", unit: "bits", threshold: 56, op: ">", desc: "대칭 알고리즘 키 길이" },
      { name: "Asymmetric key length", key: "key_asym", unit: "bits", threshold: 512, op: ">", desc: "비대칭 알고리즘 키 길이" },
      { name: "Custom/proprietary crypto", key: "custom_crypto", unit: "1=yes/0=no", threshold: 1, op: "=", desc: "비표준 자체 암호화" }
    ],
    logic: v => v.key_sym > 56 || v.key_asym > 512 || v.custom_crypto == 1,
    notes: "암호화 기능 탑재 품목. 대중시장 암호화는 License Exception ENC 가능.",
    restrictions: "EI/NS 통제. License Exception ENC (§740.17) 적용 가능 (분류 신청 후).",

  "5A992": {
    title: "5A002 비통제 정보보안 장비",
    category: "5", keywords: ["basic encryption","mass market crypto","consumer encryption","일반 보안","대중 보안"],
    params: [
      { name: "Mass market encryption", key: "mass_market", unit: "1=yes/0=no", threshold: 1, op: "=", desc: "대중시장 제품 여부" }
    ],

    notes: "대중시장 암호화 및 제한적 암호 기능 장비.",

  "5A001": {
    title: "통신 시스템/장비",
    category: "5", keywords: ["telecom","communication","radio","transmitter","receiver","transceiver","antenna","radar","통신","레이더","안테나","무선","송신기","수신기"],

  "2B001": {
    title: "금속 절삭/성형 공작기계",
    category: "2", keywords: ["cnc","machine tool","milling","turning","grinding","lathe","공작기계","밀링","선반","cnc 머신","가공기","연삭기"],
    params: [
      { name: "Positioning accuracy", key: "accuracy_um", unit: "μm", threshold: 6, op: "<", desc: "선형 위치결정 정밀도 (낮을수록 통제)" },
      { name: "Simultaneous axes", key: "axes", unit: "axes", threshold: 5, op: ">=", desc: "동시 윤곽 제어 축 수" }
    ],
    logic: v => v.accuracy_um < 6 || v.axes >= 5,
    notes: "고정밀 공작기계. 5축 이상 또는 고정밀도 시 통제.",
    restrictions: "NS/NP 통제. D:1 및 일부 D:2 국가 라이선스.",
  },
  "7A003": {
    title: "관성항법 시스템(INS) 및 부품",
    category: "7", keywords: ["ins","inertial navigation","gyroscope","accelerometer","imu","ring laser gyro","fog","관성항법","자이로","가속도계","imu","관성"],
    params: [
      { name: "Gyro bias stability", key: "gyro_bias", unit: "°/hr", threshold: 0.5, op: "<", desc: "낮을수록 고정밀" },
      { name: "Accelerometer bias", key: "accel_bias", unit: "mg", threshold: 0.5, op: "<", desc: "낮을수록 고정밀" }
    ],
    logic: v => v.gyro_bias < 0.5 || v.accel_bias < 0.5,
    notes: "관성 측정/항법. 정밀도에 따라 통제 수준 결정.",
    restrictions: "NS/MT 통제. 미사일기술 핵심 품목.",
  },
  "9A004": {
    title: "로켓/우주 발사체 시스템",
    category: "9", keywords: ["rocket","space launch","propulsion","thruster","로켓","우주발사","추진","발사체"],
    params: [
      { name: "Total impulse", key: "total_impulse", unit: "MN·s", threshold: 1.1, op: ">", desc: "총 추력량" }
    ],
    logic: v => v.total_impulse > 1.1,
    notes: "우주발사 및 관측로켓 시스템.",
    restrictions: "MT/NS 통제. MTCR Category I 품목.",
  },
  "EAR99": {
    title: "CCL 미등재 EAR 대상 품목",
    category: "N/A", keywords: [],
    params: [],
    logic: () => true,
    notes: "EAR 대상이나 CCL에 특정 기재되지 않은 품목. 대부분의 상용 품목이 해당.",
    restrictions: "일반적으로 NLR (No License Required). 엠바고/제재 제한은 적용.",
  }
};

const KNOWN_CASES = [
  { product: "NVIDIA A100 (80GB)", eccn: "3A090", spec: "TPP ~624 TOPS INT8" },
  { product: "NVIDIA H100 (SXM)", eccn: "3A090", spec: "TPP ~3958 TOPS INT8" },
  { product: "NVIDIA H800", eccn: "3A090.a", spec: "Reduced NVLink BW" },
  { product: "NVIDIA RTX 4090", eccn: "3A090.a", spec: "TPP ~1321 TOPS" },
  { product: "AMD MI300X", eccn: "3A090", spec: "TPP >>4800 TOPS" },
  { product: "Intel Gaudi2", eccn: "3A090", spec: "AI training accelerator" },
  { product: "General Server CPU", eccn: "4A994", spec: "Below threshold" },
  { product: "AES-256 Encryption IC", eccn: "5A002", spec: "256-bit symmetric" },
  { product: "Xilinx Alveo U280", eccn: "3A001", spec: "FPGA >700K gates" },
  { product: "Oscilloscope >4GHz", eccn: "3A002", spec: "BW >4GHz" },
  { product: "FLIR Thermal Camera", eccn: "6A003", spec: "IR FPA sensor" },
];

// ═══════════════════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════════════════

function findCandidates(product, model) {
  const q = (product + " " + model).toLowerCase();
  const scored = [];
  for (const [eccn, e] of Object.entries(ECCN_DB)) {
    if (eccn === "EAR99") continue;
    let score = 0;
    for (const kw of e.keywords) { if (q.includes(kw)) score += kw.length; }
    if (score > 0) {
      scored.push({ eccn, ...e, score, likelihood: score > 20 ? "high" : score > 8 ? "medium" : "low" });
    }
  }
  scored.sort((a, b) => b.score - a.score);
  const r = scored.slice(0, 7);
  r.push({ eccn: "EAR99", ...ECCN_DB["EAR99"], score: 0, likelihood: "low" });
  return r;
}

function evalParam(p, val) {
  const v = parseFloat(val);
  if (isNaN(v)) return null;
  switch (p.op) {
    case ">": return v > p.threshold;
    case ">=": return v >= p.threshold;
    case "<": return v < p.threshold;
    case "<=": return v <= p.threshold;
    case "=": return v == p.threshold;
  }
  return null;
}

function classifyAll(cands, vals) {
  const results = [];
  for (const c of cands) {
    if (c.eccn === "EAR99") continue;
    const entry = ECCN_DB[c.eccn];
    if (!entry?.params?.length) continue;
    const pr = entry.params.map(p => {
      const val = vals[c.eccn + "_" + p.key];
      return { ...p, value: val, passed: evalParam(p, val) };
    });
    const nums = {};
    pr.forEach(p => { nums[p.key] = parseFloat(p.value) || 0; });
    const allFilled = pr.every(p => p.value !== undefined && p.value !== "");
    results.push({ eccn: c.eccn, entry, pr, matches: allFilled ? entry.logic(nums) : false, allFilled });
  }
  results.sort((a, b) => (b.matches ? 1 : 0) - (a.matches ? 1 : 0));
  return results;
}

// ═══════════════════════════════════════════════════════════
// STATE + RENDER
// ═══════════════════════════════════════════════════════════

const S = { step: 0, product: "", model: "", cands: null, vals: {}, results: null };

function esc(s) { return s == null ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  // Header
  app.insertAdjacentHTML("beforeend", `
    <div class="header">
      <div class="header-badge"><span style="font-size:22px">🔬</span><span class="header-title">ECCN Classifier</span></div>
      <p class="header-sub">Rule-Based 수출통제 품목분류 (EAR) · ${Object.keys(ECCN_DB).length} ECCNs 내장 · No API Required</p>
    </div>`);

  // Steps
  const labels = ["품목 입력","ECCN 후보군","파라미터 입력","최종 결과"];
  let sh = '<div class="steps">';
  labels.forEach((l, i) => {
    const c = i < S.step ? "done" : i === S.step ? "active" : "pending";
    sh += `<div class="step-item"><div class="step-node"><div class="step-circle ${c}">${i < S.step ? "✓" : i+1}</div><span class="step-label ${c}">${l}</span></div></div>`;
    if (i < labels.length-1) sh += `<div class="step-line ${i < S.step ? "done" : "pending"}"></div>`;
  });
  sh += "</div>";
  app.insertAdjacentHTML("beforeend", sh);

  // Step 0
  if (S.step === 0) {
    app.insertAdjacentHTML("beforeend", `
      <div class="card">
        <div class="card-title">🎯 분류 대상 품목 입력</div>
        <div class="field"><label class="field-label">품목 설명 <span class="req">*</span></label>
          <input class="inp" id="ip" placeholder="예: GPU, AI accelerator, FPGA, 암호화 칩, 열화상 카메라, CNC..." value="${esc(S.product)}" /></div>
        <div class="field"><label class="field-label">모델명 (선택)</label>
          <input class="inp" id="im" placeholder="예: NVIDIA H100, AMD MI300X..." value="${esc(S.model)}" /></div>
        <div style="margin-top:8px;padding:10px 14px;background:rgba(139,92,246,.06);border-radius:10px;border:1px solid rgba(139,92,246,.1);">
          <div style="font-size:11px;color:var(--accent3);font-weight:600;margin-bottom:6px;">💡 지원 카테고리</div>
          <div style="font-size:11px;color:var(--text3);line-height:1.7;">Cat 1: 화학물질 · Cat 2: 공작기계 · Cat 3: 전자부품/GPU/FPGA/측정기 · Cat 4: 컴퓨터/서버 · Cat 5: 암호화/통신 · Cat 6: 센서/카메라/레이저 · Cat 7: 관성항법 · Cat 9: 추진체</div>
        </div>
        <div class="btn-row"><button class="btn btn-primary" id="bf">ECCN 후보군 분석 →</button></div>
      </div>`);
    setTimeout(() => {
      const ip = document.getElementById("ip"), im = document.getElementById("im");
      ip.addEventListener("input", e => S.product = e.target.value);
      im.addEventListener("input", e => S.model = e.target.value);
      const go = () => { if (!S.product.trim()) return; S.cands = findCandidates(S.product, S.model); S.step = 1; render(); };
      document.getElementById("bf").addEventListener("click", go);
      ip.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      im.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      ip.focus();
    }, 10);
  }

  // Step 1: Candidates
  if (S.step >= 1 && S.cands) {
    let h = `<div class="card"><div class="card-title">📋 ECCN 후보군 (${S.cands.length}건)</div>`;
    S.cands.forEach(c => {
      h += `<div class="cand"><span class="cand-eccn">${c.eccn}</span><div class="cand-body"><div class="cand-title">${esc(c.title)}</div><div class="cand-reason">${esc(c.notes||"")}</div></div><span class="badge badge-${c.likelihood}">${c.likelihood}</span></div>`;
    });
    if (S.step === 1) h += `<div class="btn-row"><button class="btn btn-ghost" id="r1">처음부터</button><button class="btn btn-primary" id="bp">파라미터 입력 →</button></div>`;
    h += "</div>";
    app.insertAdjacentHTML("beforeend", h);
    if (S.step === 1) setTimeout(() => {
      document.getElementById("r1")?.addEventListener("click", reset);
      document.getElementById("bp")?.addEventListener("click", () => { S.step = 2; render(); });
    }, 10);
  }

  // Step 2: Params
  if (S.step >= 2 && S.cands) {
    const rel = S.cands.filter(c => c.eccn !== "EAR99" && ECCN_DB[c.eccn]?.params?.length);
    let h = `<div class="card"><div class="card-title">⚙️ 기술 파라미터 입력</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:14px;">각 ECCN 판정 기준 파라미터 값을 입력하세요. 동일 파라미터는 자동 공유됩니다.</div>`;
    const seen = new Set();
    rel.forEach(c => {
      const e = ECCN_DB[c.eccn];
      if (!e.params.some(p => !seen.has(p.key))) return;
      h += `<div class="eccn-group"><div class="eccn-group-header"><span class="eccn-tag">${c.eccn}</span> 판정 파라미터</div>`;
      e.params.forEach(p => {
        if (seen.has(p.key)) return;
        seen.add(p.key);
        const fk = c.eccn + "_" + p.key;
        const v = S.vals[fk] || "";
        h += `<div class="param-row"><div class="param-info"><div class="param-name">${esc(p.name)}</div><div class="param-thresh">Threshold: ${p.op} ${p.threshold} ${esc(p.unit)}</div></div>
          <div class="param-input"><input class="inp pv" data-fk="${fk}" data-pk="${p.key}" placeholder="${p.unit.includes('yes') ? '1=yes, 0=no' : '값 입력'}" value="${esc(v)}" style="width:120px;text-align:right;padding:6px 10px;font-size:13px;font-family:var(--mono);" /><span class="param-unit">${esc(p.unit)}</span></div></div>`;
      });
      h += "</div>";
    });
    if (S.step === 2) h += `<div class="btn-row"><button class="btn btn-ghost" id="r2">처음부터</button><button class="btn btn-primary" id="bc">최종 Classification →</button></div>`;
    h += "</div>";
    app.insertAdjacentHTML("beforeend", h);
    if (S.step === 2) setTimeout(() => {
      document.querySelectorAll(".pv").forEach(inp => {
        inp.addEventListener("input", e => {
          const fk = e.target.dataset.fk, pk = e.target.dataset.pk;
          S.vals[fk] = e.target.value;
          S.cands.forEach(c => {
            if (c.eccn === "EAR99") return;
            if (ECCN_DB[c.eccn]?.params?.some(p => p.key === pk)) S.vals[c.eccn + "_" + pk] = e.target.value;
          });
        });
      });
      document.getElementById("r2")?.addEventListener("click", reset);
      document.getElementById("bc")?.addEventListener("click", () => {
        S.results = classifyAll(S.cands, S.vals);
        S.step = 3;
        render();
        setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 50);
      });
    }, 10);
  }

  // Step 3: Result
  if (S.step >= 3 && S.results) {
    const matched = S.results.filter(r => r.matches);
    const best = matched[0] || null;
    const eccn = best ? best.eccn : "EAR99";
    const entry = ECCN_DB[eccn];
    const conf = best ? (matched.length === 1 ? "high" : "medium") : "low";

    let h = `<div class="result-card"><div style="text-align:center;margin-bottom:22px;">
      <div style="font-size:13px;color:var(--accent2);font-weight:600;letter-spacing:1px;margin-bottom:6px;">CLASSIFICATION RESULT</div>
      <div class="result-eccn">${eccn}</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px;">${esc(entry.title)}</div>
      <span class="badge badge-${conf}" style="margin-top:8px;font-size:12px;">신뢰도: ${conf}</span></div>`;

    // Param analysis
    if (best) {
      h += `<div class="result-section"><div class="result-section-title">📊 파라미터 분석</div><div style="margin-top:8px;">`;
      best.pr.forEach(p => {
        const st = p.passed === true ? "pass" : p.passed === false ? "fail" : "na";
        const lb = p.passed === true ? "MEET" : p.passed === false ? "NOT MET" : "N/A";
        h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px;">
          <span class="param-status param-${st}">${lb}</span>
          <span style="color:var(--text)">${esc(p.name)}: </span>
          <span style="font-family:var(--mono);color:var(--gold2);">${esc(p.value||'N/A')}</span>
          <span style="color:var(--text3);">(${p.op} ${p.threshold} ${esc(p.unit)})</span></div>`;
      });
      h += "</div></div>";
    }

    h += `<div class="result-section"><div class="result-section-title">📌 분류 근거</div>
      <div class="result-section-text">${best ? `입력된 기술 파라미터가 <strong>${eccn}</strong>의 판정 기준을 충족합니다. ${esc(entry.notes)}` : `입력된 파라미터가 CCL 항목 기준을 충족하지 않습니다. <strong>EAR99</strong> (비통제)로 분류됩니다. ${esc(entry.notes)}`}</div></div>`;

    h += `<div class="result-section"><div class="result-section-title">🚨 수출통제 참고</div>
      <div class="result-section-text">${esc(entry.restrictions)}</div></div>`;

    // Alternatives
    const alts = [...matched.slice(1), ...S.results.filter(r => !r.matches).slice(0, 4)];
    if (alts.length) {
      h += `<div class="result-section"><div class="result-section-title">🔄 검토된 대안 ECCN</div>`;
      alts.forEach(r => {
        h += `<div style="display:flex;gap:8px;margin-bottom:4px;font-size:12px;">
          <span style="font-family:var(--mono);color:var(--text3);min-width:70px;">${r.eccn}</span>
          <span class="badge ${r.matches?'badge-medium':'badge-low'}" style="font-size:9px;">${r.matches?'MATCH':'NOT MET'}</span>
          <span style="color:var(--text3);">— ${esc(r.entry.title)}</span></div>`;
      });
      h += "</div>";
    }

    // Cases
    const cases = KNOWN_CASES.filter(c => S.cands.some(cd => c.eccn.startsWith(cd.eccn.split(".")[0]))).slice(0, 8);
    if (cases.length) {
      h += `<div style="margin-top:16px;"><div style="font-size:12px;color:var(--accent2);margin-bottom:8px;font-weight:600;">📋 참고 사례</div>
        <table class="case-table"><thead><tr><th>품목</th><th>ECCN</th><th>Spec</th></tr></thead><tbody>`;
      cases.forEach(c => {
        h += `<tr><td style="color:var(--text)">${esc(c.product)}</td><td><span class="case-eccn">${c.eccn}</span></td><td style="color:var(--text3);font-size:11px;">${esc(c.spec)}</td></tr>`;
      });
      h += "</tbody></table></div>";
    }

    h += `<div class="btn-row" style="justify-content:center;margin-top:22px;"><button class="btn btn-primary" id="rr" style="padding:10px 32px;">🔄 새로운 품목 분류하기</button></div></div>`;
    app.insertAdjacentHTML("beforeend", h);
    setTimeout(() => { document.getElementById("rr")?.addEventListener("click", reset); }, 10);
  }

  app.insertAdjacentHTML("beforeend", `<div class="footer">⚠️ 본 도구는 참고용이며, 최종 ECCN 분류는 반드시 전문가 검토 및 BIS 공식 자료를 통해 확인하세요.<br>ECCN Rule-Based Classifier · ${Object.keys(ECCN_DB).length} ECCNs · Decision Tree Engine · No API</div>`);
}

function reset() {
  S.step = 0; S.product = ""; S.model = ""; S.cands = null; S.vals = {}; S.results = null;
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

render();
</script>
</body>
</html>
